<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menú Luicelato</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  
  <style>
    body, html {
      margin: 0; padding: 0; background-color: #2c2c2c; height: 100vh;
      display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* Toolbar pinned to the top */
    #toolbar {
      background-color: #1a1a1a; padding: 12px; display: flex; justify-content: center;
      gap: 12px; align-items: center; flex-wrap: wrap; z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); color: white;
    }
    
    button {
      background-color: #4a4a4a; color: white; border: none; padding: 10px 16px;
      border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
      /* Improves tap response on touch screens */
      touch-action: manipulation; 
    }
    
    button:active { background-color: #666; }
    button:disabled { background-color: #333; color: #777; cursor: not-allowed; }
    
    .page-info { font-size: 15px; font-weight: 500; min-width: 90px; text-align: center; }
    
    /* Scrollable container for the PDF */
    #canvas-container {
      flex-grow: 1; overflow: auto; display: flex; justify-content: center;
      align-items: flex-start; padding: 15px;
    }
    
    canvas {
      box-shadow: 0 8px 16px rgba(0,0,0,0.5); background-color: white;
      /* Ensures sharp rendering */
      image-rendering: -webkit-optimize-contrast; 
    }
    
    .error-msg { color: white; text-align: center; margin-top: 40px; font-size: 18px; }
    .error-msg a { color: #4da6ff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div id="toolbar">
    <button id="zoom-out" aria-label="Alejar"> - </button>
    <button id="zoom-in" aria-label="Acercar"> + </button>
    <button id="prev" aria-label="Página Anterior">Anterior</button>
    <span class="page-info">Pág <span id="page_num"></span> / <span id="page_count"></span></span>
    <button id="next" aria-label="Página Siguiente">Siguiente</button>
  </div>

  <div id="canvas-container">
    <canvas id="pdf-render"></canvas>
  </div>

  <script>
    // --- Configuration ---
    const url = 'menu.pdf'; // Ensure your PDF is named exactly this
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumIsPending = null,
        scale = 1.2, // Default zoom level for mobile
        canvas = document.getElementById('pdf-render'),
        ctx = canvas.getContext('2d');

    // Render the page
    const renderPage = num => {
      pageIsRendering = true;
      
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderCtx = { canvasContext: ctx, viewport: viewport };
        
        page.render(renderCtx).promise.then(() => {
          pageIsRendering = false;
          if (pageNumIsPending !== null) {
            renderPage(pageNumIsPending);
            pageNumIsPending = null;
          }
        });
        
        document.getElementById('page_num').textContent = num;
      });
    };

    // Check for pending page renders
    const queueRenderPage = num => {
      if (pageIsRendering) { pageNumIsPending = num; } 
      else { renderPage(num); }
    };

    // Button functionalities
    document.getElementById('prev').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('next').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    document.getElementById('zoom-in').addEventListener('click', () => {
      if (scale >= 3.0) return; // Max zoom limit
      scale += 0.25;
      queueRenderPage(pageNum);
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      if (scale <= 0.5) return; // Min zoom limit
      scale -= 0.25;
      queueRenderPage(pageNum);
    });

    // Fetch the PDF Document
    pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
      pdfDoc = pdfDoc_;
      document.getElementById('page_count').textContent = pdfDoc.numPages;
      renderPage(pageNum);
    }).catch(err => {
      // Fallback if the PDF fails to load or the file name is wrong
      document.getElementById('canvas-container').innerHTML = 
        `<div class="error-msg">No se pudo cargar el menú interactivo.<br><br>
        <a href="menu.pdf" target="_blank">Toca aquí para abrir el PDF directamente</a></div>`;
      console.error('PDF Load Error: ', err);
    });
  </script>
</body>
</html>
